[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
# Fixtures imported from another test module are used as arguments, which
# pyflakes reports as F811 (redefinition); the idiom is deliberate.
per-file-ignores =
    tests/unit/test_bgjob_quota.py: F811
    tests/unit/test_job_codex.py: F811
    tests/unit/test_limits_claude_usage.py: F811
