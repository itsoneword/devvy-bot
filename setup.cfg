[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
# Fixtures imported from another test module are used as arguments, which
# pyflakes reports as F811 (redefinition); the idiom is deliberate.
per-file-ignores =
    tests/unit/test_bgjob_quota.py: F811
    tests/unit/test_designloop/test_current_render.py: F811
    tests/unit/test_job_codex.py: F811
    tests/unit/test_limits_claude_usage.py: F811
    tests/unit/test_codex_cli_integration.py: F811
    tests/unit/test_codex_partial_quota.py: F811
    tests/unit/test_designloop/test_loop_not_ready_offer.py: F811
    tests/unit/test_designloop/test_steps_rerun.py: F811
    tests/unit/test_pump2/test_pump2_cardfiles.py: F811
    tests/unit/test_pump2/test_pump2_cleanup.py: F811
    tests/unit/test_pump2/test_pump2_design_not_ready.py: F811
    tests/unit/test_pump2/test_pump2_pickup.py: F811
    tests/unit/test_pump2/test_pump2_resync.py: F811
