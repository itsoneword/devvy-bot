# Alembic config for the bot's 4 SQLite DBs (dv-5e4f). One named section per
# DB, each with its own script dir and its own alembic_version table:
#
#   poetry run alembic -n bot current
#   poetry run alembic -n data check
#   poetry run alembic -n bot revision --autogenerate -m "add foo"
#   poetry run alembic -n llm_analytics current -x db=/path/to/copy.db
#
# Without -x db=..., the DB path comes from the configured data layout
# (DEVVY_DATA_ROOT). The bot applies pending migrations itself at startup,
# after a backup (src/storage/schema/migrate.py). See
# docs/database-migrations.md.

[DEFAULT]
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[bot]
script_location = %(here)s/migrations/bot

[data]
script_location = %(here)s/migrations/data

[llm_analytics]
script_location = %(here)s/migrations/llm_analytics

[channel_intel]
script_location = %(here)s/migrations/channel_intel

# Logging is only configured for the CLI; in-process runs keep the app's.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
